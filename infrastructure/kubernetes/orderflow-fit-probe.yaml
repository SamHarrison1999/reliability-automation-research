apiVersion: v1
kind: Namespace
metadata:
  name: orderflow-fit-probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: orderflow-fit-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: orderflow/inventory:fit-probe-v1
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: orderflow-fit-probe
spec:
  selector:
    app: inventory
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: orderflow-fit-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: orderflow/order-api:fit-probe-v1
          env:
            - name: INVENTORY_URL
              value: http://inventory:8081
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: orderflow-fit-probe
spec:
  selector:
    app: order-api
  ports:
    - port: 8080
      targetPort: 8080
