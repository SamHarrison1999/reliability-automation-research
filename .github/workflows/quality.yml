name: Engineering quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,observability]'

      - name: Run Python quality checks
        run: bash scripts/run-quality-checks.sh --python-only

  infrastructure-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install infrastructure validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cloc shellcheck
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pwsh -NoLogo -NoProfile -Command \
            'Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber'
          python -m pip install --upgrade pip
          python -m pip install -e '.[infrastructure]'

      - name: Validate shell, YAML and Ansible boundaries
        run: bash scripts/validate-infrastructure.sh --strict

      - name: Produce CLOC report
        run: bash scripts/run-cloc.sh
