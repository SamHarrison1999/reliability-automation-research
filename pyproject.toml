[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-automation-research"
version = "0.1.0"
description = "Research fit-probe tooling for reliability automation experiments"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "mypy>=1.16",
  "pip-audit>=2.9",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.12",
]
infrastructure = [
  "ansible-core>=2.17",
  "ansible-lint>=24.0",
  "yamllint>=1.35",
]
observability = [
  "opentelemetry-api==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-proto==1.44.0",
  "opentelemetry-sdk==1.44.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["tmp", "results", "docs/proposal/source"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = "(^|/)(tmp|results|docs/proposal/source)/"

[tool.bandit]
exclude_dirs = ["tests", "tmp", "results"]
skips = ["B310", "B404", "B603", "B607"]
